<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10231f">
  <title>經典貪食蛇</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10231f;
      --panel: #19342e;
      --panel-light: #21443a;
      --text: #f2f7e9;
      --muted: #c2d4c8;
      --accent: #b6f36b;
      --food: #ff785e;
      --line: #33554a;
      --button-text: #12231a;
      --board-bg: #142d25;
      --snake-head: #d3ff87;
      --snake-body: #8bd857;
      --food-color: #ff785e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at top, #1b3b31 0, var(--bg) 62%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      letter-spacing: .03em;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
    }

    .intro {
      margin: 0 0 22px;
    }

    .card {
      border: 1px solid #34584b;
      border-radius: 20px;
      padding: clamp(18px, 5vw, 26px);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 18px 50px #07130f66;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field label,
    legend {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-weight: 650;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 9px 12px;
      border: 1px solid #527365;
      border-radius: 10px;
      background: #10251f;
      color: var(--text);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    fieldset {
      grid-column: 1 / -1;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .directions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .direction-option {
      position: relative;
    }

    .direction-option input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .direction-option span {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 1px solid #527365;
      border-radius: 10px;
      background: #10251f;
      color: var(--text);
      cursor: pointer;
    }

    .direction-option input:checked + span {
      border-color: var(--accent);
      background: #345b3c;
      color: #fff;
    }

    .direction-option input:focus-visible + span {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hint {
      margin: 16px 0 0;
      font-size: .92rem;
    }

    .appearance-title {
      margin: 24px 0 12px;
    }

    .appearance-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .color-field {
      display: flex;
      min-width: 0;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px 8px 12px;
      border: 1px solid #527365;
      border-radius: 10px;
      background: #10251f;
      color: var(--text);
      font-weight: 650;
    }

    .color-field input {
      width: 48px;
      height: 40px;
      padding: 2px;
      border: 1px solid #789788;
      border-radius: 8px;
      background: #10251f;
      cursor: pointer;
    }

    .color-field input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .color-preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      width: min(100%, 240px);
      height: 38px;
      margin-top: 14px;
      padding: 5px;
      border: 1px solid #789788;
      border-radius: 8px;
      background: var(--board-bg);
    }

    .color-preview span {
      border-radius: 4px;
    }

    .color-preview .preview-head {
      background: var(--snake-head);
    }

    .color-preview .preview-body {
      background: var(--snake-body);
    }

    .color-preview .preview-food {
      background: var(--food-color);
    }

    .primary {
      min-height: 52px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--button-text);
      font-weight: 800;
      cursor: pointer;
    }

    .primary:hover {
      background: #c8ff87;
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .start-row {
      margin-top: 20px;
    }

    .error {
      min-height: 1.5em;
      margin: 10px 0 0;
      color: #ffb6a5;
      font-weight: 600;
    }

    .game {
      display: none;
    }

    .game.active {
      display: block;
    }

    .setup.hidden {
      display: none;
    }

    .scorebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .score-label {
      color: var(--muted);
      font-weight: 650;
    }

    .score {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .board-wrap {
      position: relative;
      width: min(100%, 560px);
      margin: 0 auto;
      overflow: hidden;
      border: 3px solid #527365;
      border-radius: 14px;
      background: var(--board-bg);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #091710d9;
      text-align: center;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-card {
      width: min(100%, 330px);
      padding: 24px 18px;
      border: 1px solid #527365;
      border-radius: 16px;
      background: #19342e;
    }

    .overlay-card p {
      margin: 0 0 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(2, 58px);
      justify-content: center;
      gap: 8px;
      margin: 20px auto 0;
      touch-action: none;
    }

    .controls button {
      min-width: 60px;
      min-height: 56px;
      border: 1px solid #628574;
      border-radius: 14px;
      background: var(--panel-light);
      color: var(--text);
      font-size: 1rem;
      font-weight: 750;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .controls button:active {
      background: #3b654d;
      transform: scale(.97);
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .play-hint {
      margin: 16px 0 0;
      text-align: center;
      font-size: .9rem;
    }

    @media (max-width: 430px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .settings-grid {
        gap: 12px;
      }

      .controls {
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(2, 62px);
      }

      .controls button {
        min-height: 60px;
      }
    }

    @media (max-width: 340px) {
      .settings-grid,
      .appearance-grid {
        grid-template-columns: 1fr;
      }

      fieldset {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="setup" class="card setup" aria-labelledby="title">
      <h1 id="title">經典貪食蛇</h1>
      <p class="intro">吃下食物讓蛇變長。用方向鍵或 W、A、S、D 控制；手機可點下方方向按鈕。撞到牆或自己就結束。</p>

      <h2>遊戲設定</h2>
      <div class="settings-grid">
        <div class="field">
          <label for="length">初始蛇長（格）</label>
          <input id="length" type="number" inputmode="numeric" min="1" step="1" required>
        </div>

        <fieldset>
          <legend>初始方向</legend>
          <div class="directions">
            <label class="direction-option">
              <input type="radio" name="direction" value="up">
              <span>上</span>
            </label>
            <label class="direction-option">
              <input type="radio" name="direction" value="down">
              <span>下</span>
            </label>
            <label class="direction-option">
              <input type="radio" name="direction" value="left">
              <span>左</span>
            </label>
            <label class="direction-option">
              <input type="radio" name="direction" value="right">
              <span>右</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label for="points">每個食物分數</label>
          <input id="points" type="number" inputmode="numeric" min="0" step="1" required>
        </div>

        <div class="field">
          <label for="growth">每個食物增長（格）</label>
          <input id="growth" type="number" inputmode="numeric" min="1" step="1" required>
        </div>
      </div>

      <h2 class="appearance-title">色彩設定</h2>
      <div class="appearance-grid">
        <label class="color-field" for="backgroundColor">
          <span>遊戲區背景</span>
          <input id="backgroundColor" type="color" value="#142d25" aria-label="遊戲區背景色">
        </label>
        <label class="color-field" for="headColor">
          <span>蛇頭</span>
          <input id="headColor" type="color" value="#d3ff87" aria-label="蛇頭顏色">
        </label>
        <label class="color-field" for="bodyColor">
          <span>蛇身</span>
          <input id="bodyColor" type="color" value="#8bd857" aria-label="蛇身顏色">
        </label>
        <label class="color-field" for="foodColor">
          <span>食物</span>
          <input id="foodColor" type="color" value="#ff785e" aria-label="食物顏色">
        </label>
      </div>

      <div class="color-preview" aria-label="色彩預覽">
        <span class="preview-head" title="蛇頭"></span>
        <span class="preview-body" title="蛇身"></span>
        <span class="preview-food" title="食物"></span>
        <span aria-hidden="true"></span>
      </div>

      <p class="hint">棋盤為 20 × 20 格。請填妥設定後開始。</p>
      <div class="start-row">
        <button id="start" class="primary" type="button">開始</button>
      </div>
      <p id="setupError" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section id="game" class="card game" aria-label="貪食蛇遊戲">
      <div class="scorebar">
        <span class="score-label">本局分數</span>
        <span id="score" class="score" aria-live="polite">0</span>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="600" height="600" role="img" aria-label="貪食蛇棋盤"></canvas>
        <div id="overlay" class="overlay" aria-live="polite">
          <div class="overlay-card">
            <h2 id="endTitle">遊戲結束</h2>
            <p>本局分數：<strong id="finalScore">0</strong></p>
            <button id="restart" class="primary" type="button">重新開始</button>
          </div>
        </div>
      </div>

      <div class="controls" aria-label="觸控方向控制">
        <button class="up" type="button" data-direction="up" aria-label="向上">上</button>
        <button class="left" type="button" data-direction="left" aria-label="向左">左</button>
        <button class="down" type="button" data-direction="down" aria-label="向下">下</button>
        <button class="right" type="button" data-direction="right" aria-label="向右">右</button>
      </div>

      <p class="play-hint">桌機：方向鍵或 W、A、S、D　·　手機：點方向按鈕</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const SIZE = 20;
      const CELL = 30;
      const STEP_MS = 145;

      const setup = document.getElementById('setup');
      const game = document.getElementById('game');
      const lengthInput = document.getElementById('length');
      const pointsInput = document.getElementById('points');
      const growthInput = document.getElementById('growth');
      const colorInputs = {
        background: document.getElementById('backgroundColor'),
        head: document.getElementById('headColor'),
        body: document.getElementById('bodyColor'),
        food: document.getElementById('foodColor')
      };
      const setupError = document.getElementById('setupError');
      const scoreNode = document.getElementById('score');
      const finalScoreNode = document.getElementById('finalScore');
      const overlay = document.getElementById('overlay');
      const endTitle = document.getElementById('endTitle');
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');

      const vectors = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const opposites = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      let snake = [];
      let food = null;
      let direction = 'right';
      let queuedDirection = 'right';
      let score = 0;
      let growthPending = 0;
      let settings = null;
      let colors = {
        background: '#142d25',
        head: '#d3ff87',
        body: '#8bd857',
        food: '#ff785e'
      };
      let timer = null;
      let running = false;

      function colorLuminance(color) {
        const channels = color.match(/[\da-f]{2}/gi).map(value => parseInt(value, 16) / 255);
        const linear = channels.map(value =>
          value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4
        );
        return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
      }

      function contrastRatio(first, second) {
        const values = [colorLuminance(first), colorLuminance(second)].sort((a, b) => b - a);
        return (values[0] + 0.05) / (values[1] + 0.05);
      }

      function contrastInk(color) {
        const luminance = colorLuminance(color);
        const blackContrast = (luminance + 0.05) / 0.05;
        const whiteContrast = 1.05 / (luminance + 0.05);
        return blackContrast >= whiteContrast ? '#101610' : '#ffffff';
      }

      function updateColorPreview() {
        const root = document.documentElement;
        root.style.setProperty('--board-bg', colorInputs.background.value);
        root.style.setProperty('--snake-head', colorInputs.head.value);
        root.style.setProperty('--snake-body', colorInputs.body.value);
        root.style.setProperty('--food-color', colorInputs.food.value);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = colors.background;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const backgroundInk = contrastInk(colors.background);
        const originalBackground = colors.background.toLowerCase() === '#142d25';
        ctx.strokeStyle = originalBackground ? '#33554a' : backgroundInk;
        ctx.globalAlpha = originalBackground ? 1 : 0.2;
        ctx.lineWidth = 1;

        for (let i = 0; i <= SIZE; i++) {
          const position = i * CELL + 0.5;

          ctx.beginPath();
          ctx.moveTo(position, 0);
          ctx.lineTo(position, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, position);
          ctx.lineTo(canvas.width, position);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;

        if (food) {
          ctx.fillStyle = colors.food;
          ctx.beginPath();
          ctx.arc(
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2,
            CELL * 0.34,
            0,
            Math.PI * 2
          );
          ctx.fill();

          if (contrastRatio(colors.food, colors.background) < 3) {
            ctx.strokeStyle = backgroundInk;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }

          ctx.fillStyle = colors.food.toLowerCase() === '#ff785e'
            ? '#ffd1a8'
            : contrastInk(colors.food);
          ctx.beginPath();
          ctx.arc(
            food.x * CELL + CELL * 0.39,
            food.y * CELL + CELL * 0.38,
            CELL * 0.07,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        snake.forEach((part, index) => {
          const padding = index === 0 ? 2 : 3;
          const segmentColor = index === 0 ? colors.head : colors.body;
          ctx.fillStyle = segmentColor;
          ctx.beginPath();
          ctx.roundRect(
            part.x * CELL + padding,
            part.y * CELL + padding,
            CELL - padding * 2,
            CELL - padding * 2,
            6
          );
          ctx.fill();

          if (
            contrastRatio(segmentColor, colors.background) < 3 ||
            (index === 0 && contrastRatio(colors.head, colors.body) < 1.5)
          ) {
            ctx.strokeStyle = backgroundInk;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
        });

        if (snake.length) {
          const head = snake[0];
          const eyes = direction === 'up'
            ? [[9, 8], [21, 8]]
            : direction === 'down'
              ? [[9, 22], [21, 22]]
              : direction === 'left'
                ? [[8, 9], [8, 21]]
                : [[22, 9], [22, 21]];

          ctx.fillStyle = colors.head.toLowerCase() === '#d3ff87'
            ? '#173025'
            : contrastInk(colors.head);

          for (const [eyeX, eyeY] of eyes) {
            ctx.beginPath();
            ctx.arc(
              head.x * CELL + eyeX,
              head.y * CELL + eyeY,
              2.3,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        }
      }

      function placeFood() {
        const occupied = new Set(
          snake.map(part => `${part.x},${part.y}`)
        );
        const freeCells = [];

        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!occupied.has(`${x},${y}`)) {
              freeCells.push({ x, y });
            }
          }
        }

        if (freeCells.length === 0) {
          return false;
        }

        food = freeCells[Math.floor(Math.random() * freeCells.length)];
        return true;
      }

      function initialSnake(length, startDirection) {
        const vector = vectors[startDirection];
        const head = {
          x: Math.floor((SIZE - 1) / 2),
          y: Math.floor((SIZE - 1) / 2)
        };

        if (vector.x !== 0) {
          head.x = startDirection === 'right'
            ? Math.floor((SIZE - length) / 2) + length - 1
            : Math.floor((SIZE - length) / 2);
        } else {
          head.y = startDirection === 'down'
            ? Math.floor((SIZE - length) / 2) + length - 1
            : Math.floor((SIZE - length) / 2);
        }

        return Array.from({ length }, (_, index) => ({
          x: head.x - vector.x * index,
          y: head.y - vector.y * index
        }));
      }

      function readSettings() {
        setupError.textContent = '';

        const lengthRaw = lengthInput.value.trim();
        const pointsRaw = pointsInput.value.trim();
        const growthRaw = growthInput.value.trim();
        const selectedDirection = document.querySelector(
          'input[name="direction"]:checked'
        );
        const missing = [];

        if (!lengthRaw) missing.push('初始蛇長');
        if (!selectedDirection) missing.push('初始方向');
        if (!pointsRaw) missing.push('每個食物分數');
        if (!growthRaw) missing.push('每個食物增長格數');

        if (missing.length) {
          setupError.textContent = `請填寫：${missing.join('、')}。`;
          return null;
        }

        const length = Number(lengthRaw);
        const points = Number(pointsRaw);
        const growth = Number(growthRaw);

        if (!Number.isSafeInteger(length) || length < 1) {
          setupError.textContent = '初始蛇長必須是正整數。';
          return null;
        }

        if (!Number.isSafeInteger(points) || points < 0) {
          setupError.textContent = '每個食物分數必須是非負整數。';
          return null;
        }

        if (!Number.isSafeInteger(growth) || growth < 1) {
          setupError.textContent = '每個食物增長格數必須是正整數。';
          return null;
        }

        if (length > SIZE) {
          setupError.textContent = `初始蛇長不能超過棋盤邊長 ${SIZE} 格。`;
          return null;
        }

        return {
          length,
          points,
          growth,
          direction: selectedDirection.value,
          colors: {
            background: colorInputs.background.value,
            head: colorInputs.head.value,
            body: colorInputs.body.value,
            food: colorInputs.food.value
          }
        };
      }

      function startGame() {
        if (running) {
          return;
        }

        const nextSettings = readSettings();

        if (!nextSettings) {
          return;
        }

        settings = nextSettings;
        colors = settings.colors;

        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }

        snake = initialSnake(settings.length, settings.direction);
        direction = settings.direction;
        queuedDirection = direction;
        score = 0;
        growthPending = 0;
        scoreNode.textContent = '0';
        finalScoreNode.textContent = '0';
        overlay.classList.remove('show');
        setup.classList.add('hidden');
        game.classList.add('active');
        placeFood();
        running = true;
        draw();
        timer = setInterval(tick, STEP_MS);
      }

      function finish(message) {
        running = false;

        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }

        finalScoreNode.textContent = String(score);
        endTitle.textContent = message;
        overlay.classList.add('show');
        draw();
      }

      function tick() {
        if (!running) {
          return;
        }

        direction = queuedDirection;

        const vector = vectors[direction];
        const head = snake[0];
        const next = {
          x: head.x + vector.x,
          y: head.y + vector.y
        };
        const eats = food !== null && next.x === food.x && next.y === food.y;
        const tailWillMove = !eats && growthPending === 0;

        if (
          next.x < 0 ||
          next.x >= SIZE ||
          next.y < 0 ||
          next.y >= SIZE
        ) {
          finish('撞到牆壁，遊戲結束');
          return;
        }

        const collisionLength = snake.length - (tailWillMove ? 1 : 0);

        for (let index = 0; index < collisionLength; index++) {
          if (snake[index].x === next.x && snake[index].y === next.y) {
            finish('撞到自己，遊戲結束');
            return;
          }
        }

        snake.unshift(next);

        if (eats) {
          score += settings.points;
          scoreNode.textContent = String(score);
          growthPending += settings.growth - 1;

          if (!placeFood()) {
            draw();
            finish('你填滿了棋盤！');
            return;
          }
        } else if (growthPending > 0) {
          growthPending--;
        } else {
          snake.pop();
        }

        draw();
      }

      function requestDirection(candidate) {
        if (
          !running ||
          !vectors[candidate] ||
          candidate === opposites[direction]
        ) {
          return;
        }

        queuedDirection = candidate;
      }

      document
        .getElementById('start')
        .addEventListener('click', startGame);

      document
        .getElementById('restart')
        .addEventListener('click', startGame);

      Object.values(colorInputs).forEach(input => {
        input.addEventListener('input', updateColorPreview);
        input.addEventListener('change', updateColorPreview);
      });

      document.querySelectorAll('.controls button').forEach(button => {
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          requestDirection(button.dataset.direction);
        });

        button.addEventListener('click', event => {
          event.preventDefault();
        });
      });

      window.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        const keyDirections = {
          arrowup: 'up',
          w: 'up',
          arrowdown: 'down',
          s: 'down',
          arrowleft: 'left',
          a: 'left',
          arrowright: 'right',
          d: 'right'
        };
        const candidate = keyDirections[key];

        if (candidate && running) {
          event.preventDefault();
          requestDirection(candidate);
        }
      }, { passive: false });

      updateColorPreview();
      draw();
    })();
  </script>
</body>
</html>
